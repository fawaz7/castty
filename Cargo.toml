[package]
name = "castty"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0"
description = "Linux configuration tool for the Mionix Castor mouse"
authors = ["Fawaz Alghzawi"]
repository = "https://github.com/fawaz7/castty"
homepage = "https://github.com/fawaz7/castty"
readme = "README.md"
keywords = ["mionix", "castor", "mouse", "hid", "rgb"]
categories = ["hardware-support", "gui", "command-line-utilities"]
# The session logs are the raw evidence behind PROTOCOL.md, not a build input,
# and they dominate the repository by size. Keep them in git, out of the crate.
exclude = [
    "research/captures/sessions/*",
    "docs/screenshots/*",
    "target/ui-snapshots/*",
]

# Debian packaging, driven by `cargo deb` (cargo install cargo-deb). The release
# workflow builds the .deb from this; there is no separate debian/ directory to
# keep in step.
[package.metadata.deb]
maintainer = "Fawaz Alghzawi <https://github.com/fawaz7>"
copyright = "2026 Fawaz Alghzawi. Mouse artwork in resources/ remains Mionix's -- see NOTICE.md."
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Configures the Mionix Castor gaming mouse: per-LED colour and effects, DPI \
steps, polling rate, angle snapping and tuning, lift-off distance, button \
remapping, macros, five profiles and the surface analyzer.
.
Mionix never shipped Linux software for this device and no other Linux tool \
supports it. The wire protocol was reverse engineered from captures of the \
Windows vendor application and verified against real hardware; it is \
documented in full in the source repository."""
# winit and wgpu dlopen all of this rather than linking it, so $auto finds none
# of it -- but the app cannot open a window without it.
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxrandr2"
# Rendering: Vulkan is preferred and wgpu falls back to GL, so neither is hard.
recommends = "libvulkan1, mesa-vulkan-drivers"
suggests = "libgl1"
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/castty", "usr/bin/", "755"],
    # A packaged rule belongs in /usr/lib; /etc/udev/rules.d is reserved for the
    # administrator's own overrides of it.
    ["packaging/60-mionix-castor.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/io.github.fawaz7.castty.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/hicolor/16x16/apps/io.github.fawaz7.castty.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["packaging/icons/hicolor/24x24/apps/io.github.fawaz7.castty.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["packaging/icons/hicolor/32x32/apps/io.github.fawaz7.castty.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["packaging/icons/hicolor/48x48/apps/io.github.fawaz7.castty.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["packaging/icons/hicolor/64x64/apps/io.github.fawaz7.castty.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["packaging/icons/hicolor/128x128/apps/io.github.fawaz7.castty.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["packaging/icons/hicolor/256x256/apps/io.github.fawaz7.castty.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/icons/hicolor/512x512/apps/io.github.fawaz7.castty.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["packaging/icons/hicolor/scalable/apps/io.github.fawaz7.castty.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/castty/", "644"],
    ["NOTICE.md", "usr/share/doc/castty/", "644"],
    ["research/PROTOCOL.md", "usr/share/doc/castty/", "644"],
]

[dependencies]
libc = "0.2"
# Macro names are not stored on the device -- the vendor software keeps them in
# its own config -- so the named library lives in ours.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The device worker thread hands results back over this; iced turns the
# receiver into a subscription.
async-channel = "2"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
# Headless layout assertions and snapshots for the iced UI, so a page that
# renders nothing fails a test instead of waiting for someone to look. See
# src/iced_ui/layout_tests.rs. The backend is pinned in .cargo/config.toml.
iced_test = "0.14.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic stays "unwind" deliberately: hardware reads run on background threads and
# a panic there must kill only that thread, not take down the window.
