name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # iced links against these; the tests themselves render with tiny-skia
      # (pinned in .cargo/config.toml) so no GPU or display is needed.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # The whole suite runs against the captured device frames in
        # research/captures/, so it needs neither hardware nor a display.
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release
